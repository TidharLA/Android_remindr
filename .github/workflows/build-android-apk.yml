name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**'
      - '.github/workflows/*.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool pkg-config \
            cmake libffi-dev libssl-dev \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 m4

      - name: Install Android SDK and build-tools
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest

          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root=$ANDROID_HOME \
            "platforms;android-33" \
            "build-tools;33.0.0" \
            "platform-tools" \
            "ndk;25.2.9519653"

          # Buildozer checks a legacy path: android-sdk/tools/bin/sdkmanager
          mkdir -p $ANDROID_HOME/tools/bin
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/sdkmanager
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager $ANDROID_HOME/tools/bin/avdmanager

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/33.0.0" >> $GITHUB_PATH

      - name: Verify aidl is installed
        run: |
          ls $ANDROID_HOME/tools/bin/sdkmanager
          ls $ANDROID_HOME/build-tools/33.0.0/aidl

      - name: Fix autotools compatibility for libffi
        run: |
          echo "ACLOCAL_PATH=/usr/share/aclocal" >> $GITHUB_ENV
          echo "M4=/usr/bin/m4" >> $GITHUB_ENV
          echo "LDFLAGS=-L/usr/lib" >> $GITHUB_ENV

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython<3" buildozer

      - name: Configure Buildozer to use existing SDK/NDK
        run: |
          mkdir -p $HOME/.buildozer/android/platform
          ln -sf $ANDROID_HOME $HOME/.buildozer/android/platform/android-sdk
          # Buildozer / p4a may look for different NDK folder names; provide both.
          ln -sf $ANDROID_HOME/ndk/25.2.9519653 $HOME/.buildozer/android/platform/android-ndk-r25b
          ln -sf $ANDROID_HOME/ndk/25.2.9519653 $HOME/.buildozer/android/platform/android-ndk-r28c
          ls -l $HOME/.buildozer/android/platform/

      - name: Setup libffi build environment
        run: |
          echo "LDFLAGS=-L/usr/lib -L/usr/lib/x86_64-linux-gnu" >> $GITHUB_ENV
          echo "CFLAGS=-O2" >> $GITHUB_ENV
          echo "CPPFLAGS=-I/usr/include" >> $GITHUB_ENV
          mkdir -p ~/.config/libtool
          export ACLOCAL_PATH=/usr/share/aclocal:$ACLOCAL_PATH
          echo "ACLOCAL_PATH=$ACLOCAL_PATH" >> $GITHUB_ENV

      - name: Build APK
        run: |
          buildozer -v android debug 2>&1 | tee buildozer-full.log

      - name: Locate APK output
        id: apk
        run: |
          mapfile -t apks < <(find . -type f -path "*/bin/*.apk" | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No APK files found"
            find . -maxdepth 4 -type d -name "bin" -print || true
            exit 1
          fi
          {
            echo 'apk_paths<<EOF'
            printf '%s\n' "${apks[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.apk.outputs.apk_paths }}
          if-no-files-found: error

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer-full.log
